<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFF7EC" />
    <title>口算闯关</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-sparkles" viewBox="0 0 24 24">
          <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" />
          <path d="M20 2v4" />
          <path d="M22 4h-4" />
          <circle cx="4" cy="20" r="2" />
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />
        </symbol>
        <symbol id="i-keyboard" viewBox="0 0 24 24">
          <path d="M10 8h.01" />
          <path d="M12 12h.01" />
          <path d="M14 8h.01" />
          <path d="M16 12h.01" />
          <path d="M18 8h.01" />
          <path d="M6 8h.01" />
          <path d="M7 16h10" />
          <path d="M8 12h.01" />
          <rect width="20" height="16" x="2" y="4" rx="2" />
        </symbol>
        <symbol id="i-flower" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 16.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 1 1 4.5 4.5 4.5 4.5 0 1 1-4.5 4.5" />
          <path d="M12 7.5V9" />
          <path d="M7.5 12H9" />
          <path d="M16.5 12H15" />
          <path d="M12 16.5V15" />
          <path d="m8 8 1.88 1.88" />
          <path d="M14.12 9.88 16 8" />
          <path d="m8 16 1.88-1.88" />
          <path d="M14.12 14.12 16 16" />
        </symbol>
        <symbol id="i-flame" viewBox="0 0 24 24">
          <path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="M20 6 9 17l-5-5" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </symbol>
        <symbol id="i-delete" viewBox="0 0 24 24">
          <path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z" />
          <path d="m12 9 6 6" />
          <path d="m18 9-6 6" />
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </symbol>
        <symbol id="i-house" viewBox="0 0 24 24">
          <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
          <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </symbol>
        <symbol id="i-volume" viewBox="0 0 24 24">
          <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
          <path d="M16 9a5 5 0 0 1 0 6" />
          <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
        </symbol>
        <symbol id="i-volume-off" viewBox="0 0 24 24">
          <path d="M11 4.702a.7.7 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.7.7 0 0 0 11 19.298z" />
          <path d="m16.5 14.5 5-5" />
          <path d="m16.5 9.5 5 5" />
        </symbol>
        <symbol id="i-award" viewBox="0 0 24 24">
          <path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526" />
          <circle cx="12" cy="8" r="6" />
        </symbol>
        <symbol id="i-star" viewBox="0 0 24 24">
          <path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4" />
          <path d="M12 8h.01" />
        </symbol>
      </defs>
    </svg>

    <div class="app" id="app">
      <div class="backdrop" aria-hidden="true">
        <span class="backdrop__blob backdrop__blob--coral"></span>
        <span class="backdrop__blob backdrop__blob--teal"></span>
        <span class="backdrop__blob backdrop__blob--sun"></span>
        <span class="backdrop__dashes backdrop__dashes--one"></span>
        <span class="backdrop__dashes backdrop__dashes--two"></span>
      </div>

      <section class="screen screen--ready" id="screenReady" data-testid="screen-ready">
        <header class="topbar">
          <div class="identity">
            <span class="avatar" id="avatar" aria-hidden="true">小</span>
            <span class="identity__copy">
              <span class="identity__name" id="studentName" data-testid="student-name">小小挑战者</span>
              <span class="identity__meta" id="studentMeta" data-testid="student-meta">正在连接课堂…</span>
            </span>
          </div>
          <div class="topbar__side">
            <span class="grade-chip" data-testid="grade-chip">
              <svg class="icon icon--sm" aria-hidden="true"><use href="#i-sparkles" /></svg>
              <span id="gradeLabel" data-testid="grade-label">三年级</span>
            </span>
            <button type="button" class="icon-btn" id="soundBtn" data-testid="sound-toggle" aria-label="关闭音效">
              <svg class="icon" aria-hidden="true" id="soundIcon"><use href="#i-volume" /></svg>
            </button>
          </div>
        </header>

        <p class="notice" id="contextNote" data-testid="context-note" role="status" hidden>
          <svg class="icon icon--sm" aria-hidden="true"><use href="#i-info" /></svg>
          <span id="contextNoteText"></span>
        </p>

        <main class="hero">
          <div class="hero__stage">
            <span class="tile tile--a" aria-hidden="true">7</span>
            <span class="tile tile--b" aria-hidden="true">×</span>
            <span class="tile tile--c" aria-hidden="true">12</span>
            <span class="tile tile--d" aria-hidden="true">+</span>
            <div class="paper hero__paper">
              <span class="paper__tape" aria-hidden="true"></span>
              <p class="eyebrow">
                <svg class="icon icon--sm" aria-hidden="true"><use href="#i-sparkles" /></svg>
                课间小挑战
              </p>
              <h1 class="title">
                口算闯关
                <svg class="title__swash" viewBox="0 0 300 24" aria-hidden="true">
                  <path d="M6 17C62 5 118 5 170 13s96 9 124-4" />
                </svg>
              </h1>
              <p class="subtitle">60 秒，看你能答对几道</p>
              <button type="button" class="btn btn--start" id="startBtn" data-testid="start">
                <svg class="icon" aria-hidden="true"><use href="#i-play" /></svg>
                <span>开始</span>
              </button>
              <p class="hint">
                <svg class="icon icon--xs" aria-hidden="true"><use href="#i-keyboard" /></svg>
                用手指点数字键盘作答，键盘也能用
              </p>
              <p class="best" id="bestLine" data-testid="best-line" hidden>
                <svg class="icon icon--xs" aria-hidden="true"><use href="#i-flower" /></svg>
                <span id="bestText"></span>
              </p>
            </div>
          </div>
        </main>
      </section>

      <section class="screen screen--play" id="screenPlay" data-testid="screen-play" hidden>
        <header class="hud">
          <div class="hud__timer" id="timer" data-testid="timer">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring__track" cx="60" cy="60" r="52" />
              <circle class="ring__progress" id="ringProgress" cx="60" cy="60" r="52" />
            </svg>
            <span class="timer__num" id="timeLeft" data-testid="time-left">60</span>
          </div>
          <div class="hud__stats">
            <span class="stat stat--correct">
              <svg class="icon" aria-hidden="true"><use href="#i-flower" /></svg>
              <span class="stat__label">答对</span>
              <b id="statCorrect" data-testid="correct-count">0</b>
            </span>
            <span class="stat stat--streak">
              <svg class="icon" aria-hidden="true"><use href="#i-flame" /></svg>
              <span class="stat__label">连对</span>
              <b id="statStreak" data-testid="streak-count">0</b>
            </span>
          </div>
          <span class="hud__who" id="hudWho" data-testid="hud-who">张小明 · 三年级</span>
        </header>

        <main class="board">
          <div class="question-card" id="questionCard" data-testid="question" role="group" aria-label="题目">
            <div class="question-line" id="questionLine">
              <span class="q-expr" id="qExpr" aria-live="polite"></span>
              <span class="q-eq" id="qEq" aria-hidden="true">=</span>
              <span class="q-answer" id="qAnswer" data-testid="answer">?</span>
            </div>
            <p class="feedback" id="feedback" data-testid="feedback" aria-live="assertive"></p>
          </div>

          <div class="keypad" id="keypad">
            <button type="button" class="key" data-key="1">1</button>
            <button type="button" class="key" data-key="2">2</button>
            <button type="button" class="key" data-key="3">3</button>
            <button type="button" class="key" data-key="4">4</button>
            <button type="button" class="key" data-key="5">5</button>
            <button type="button" class="key" data-key="6">6</button>
            <button type="button" class="key" data-key="7">7</button>
            <button type="button" class="key" data-key="8">8</button>
            <button type="button" class="key" data-key="9">9</button>
            <button type="button" class="key key--decimal" data-key="." id="decimalKey" aria-label="小数点" disabled>.</button>
            <button type="button" class="key" data-key="0">0</button>
            <button type="button" class="key key--back" data-key="back" aria-label="退格">
              <svg class="icon" aria-hidden="true"><use href="#i-delete" /></svg>
            </button>
            <button type="button" class="key key--confirm" data-key="confirm" data-testid="confirm">确定</button>
          </div>
        </main>
      </section>

      <section class="screen screen--result" id="screenResult" data-testid="screen-result" hidden>
        <main class="result">
          <div class="paper result__paper">
            <p class="eyebrow eyebrow--award">
              <svg class="icon icon--sm" aria-hidden="true"><use href="#i-award" /></svg>
              本局成绩
            </p>
            <h2 class="result__title">时间到！</h2>
            <div class="result__stats">
              <div class="rstat rstat--correct">
                <span class="rstat__label">答对</span>
                <span class="rstat__value"><b id="resultCorrect" data-testid="result-correct">0</b><i class="rstat__unit">道</i></span>
              </div>
              <div class="rstat rstat--accuracy">
                <span class="rstat__label">正确率</span>
                <span class="rstat__value"><b id="resultAccuracy" data-testid="result-accuracy">0</b><i class="rstat__unit">%</i></span>
              </div>
              <div class="rstat rstat--elapsed">
                <span class="rstat__label">用时</span>
                <span class="rstat__value"><b id="resultElapsed" data-testid="result-elapsed">60</b><i class="rstat__unit">秒</i></span>
              </div>
            </div>
            <div class="flowers" id="flowerPanel">
              <div class="flowers__row" id="flowerRow" aria-hidden="true"></div>
              <p class="flowers__gain" id="flowersGain" data-testid="flowers-gain" hidden></p>
              <p class="flowers__note" id="submitNote" data-testid="submit-note">正在数小红花…</p>
            </div>
            <p class="result__best" id="resultBest" data-testid="result-best" hidden>
              <svg class="icon icon--sm" aria-hidden="true"><use href="#i-sparkles" /></svg>
              <span id="resultBestText"></span>
            </p>
            <div class="actions">
              <button type="button" class="btn btn--primary" id="againBtn" data-testid="again">
                <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg>
                再来一局
              </button>
              <button type="button" class="btn btn--ghost" id="homeBtn" data-testid="home">
                <svg class="icon" aria-hidden="true"><use href="#i-house" /></svg>
                回首页
              </button>
            </div>
          </div>
        </main>
      </section>

      <div class="countdown" id="countdown" data-testid="countdown" hidden>
        <span class="countdown__halo" aria-hidden="true"></span>
        <p class="countdown__label">准备</p>
        <p class="countdown__num" id="countdownNum" data-testid="countdown-number">3</p>
      </div>

      <div class="booster" id="booster" data-testid="booster" hidden aria-live="polite">
        <svg class="icon" aria-hidden="true"><use href="#i-star" /></svg>
        <span id="boosterText">连对 5 题！</span>
      </div>

      <div class="particles" id="particles" aria-hidden="true"></div>
    </div>

    <script src="/ext/_sdk/playtime.js"></script>
    <script src="./questions.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
