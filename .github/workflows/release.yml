name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 构建前端与内置扩展
        run: make embed
      - name: 构建 Windows
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/playtime-windows-amd64.exe ./cmd/playtime
      - name: 构建 macOS
        run: GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o dist/playtime-darwin-arm64 ./cmd/playtime
      - name: 构建 Android
        run: |
          if [ -f scripts/build-android.sh ]; then
            chmod +x scripts/build-android.sh
            scripts/build-android.sh || echo "Android 构建跳过"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/playtime-windows-amd64.exe
            dist/playtime-darwin-arm64
            android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
